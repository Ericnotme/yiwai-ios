name: Export diagnostic (2 cases; not a release gate)
'on':
  push:
    branches: [p0/fortress-core-review-20261126, codex/yiwai-fortress-release-20261126]
    paths:
      - 'YiwaiPractice/UITests/ConditionStudyUITests.swift'
      - 'YiwaiPractice/UITests/TimeCapsuleUITests.swift'
      - 'release-manifest.json'
      - '.github/workflows/export-diagnostic.yml'
      - 'scripts/collect-ci-exports.py'
      - 'scripts/verify-export-pair.py'
      - 'YiwaiPractice/Resources/fortress-course-v1.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yiwai-export-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exports:
    name: Two export cases only (diagnostic)
    if: github.ref == 'refs/heads/p0/fortress-core-review-20261126' || github.ref == 'refs/heads/codex/yiwai-fortress-release-20261126'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout exact public candidate without credentials
        id: checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout --detach "$GITHUB_SHA"
          mkdir -p export-diagnostic-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD | tee export-diagnostic-evidence/source-commit.txt
          xcodebuild -version | tee export-diagnostic-evidence/xcode-version.txt
          printf '%s\n' 'DIAGNOSTIC ONLY: two export UI cases; does not replace full 94-unit/34-UI/Release gates.' > export-diagnostic-evidence/scope.txt
      - name: Verify exact source manifest
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-source.py 2>&1 | tee export-diagnostic-evidence/source-verification.log
      - name: Select and record this job's simulator
        id: simulator
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > export-diagnostic-evidence/devices.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('export-diagnostic-evidence')
          devices=json.loads((root/'devices.json').read_text())['devices']
          options=[(runtime,x['name'],x['udid'],x) for runtime,items in devices.items() if 'iOS-' in runtime for x in items if x.get('isAvailable') and x['name'].startswith('iPhone')]
          assert options, 'No available iPhone simulator'
          selected=sorted(options,key=lambda x:x[:3])[-1]
          info=dict(selected[3],runtime=selected[0])
          assert info.get('dataPath'), 'simctl did not report the selected simulator dataPath'
          (root/'selected-device.json').write_text(json.dumps(info,indent=2))
          (root/'test-device.txt').write_text(info['udid']+'\n')
          print('Selected '+info['name']+' '+info['udid'])
          PY
      - name: Run both real export cases serially
        timeout-minutes: 20
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          DIAG_DEVICE=$(cat export-diagnostic-evidence/test-device.txt)
          set +e
          xcodebuild test -project YiwaiPractice/YiwaiPractice.xcodeproj -scheme YiwaiPractice -configuration Debug -destination "platform=iOS Simulator,id=$DIAG_DEVICE" -parallel-testing-enabled NO -only-testing:YiwaiUITests/ConditionStudyUITests/testExplicitCompleteExportEndsRoundWithoutInventingAnswers -only-testing:YiwaiUITests/TimeCapsuleUITests/testOfflineImportNoteRelaunchAndExportPicker -resultBundlePath export-diagnostic-evidence/ExportTests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee export-diagnostic-evidence/export-tests.log
          DIAG_TEST_EXIT=${PIPESTATUS[0]}
          printf '%s\n' "$DIAG_TEST_EXIT" > export-diagnostic-evidence/test-exit.txt
          xcrun xcresulttool get test-results summary --path export-diagnostic-evidence/ExportTests.xcresult --compact > export-diagnostic-evidence/test-summary.json 2> export-diagnostic-evidence/test-summary-error.log
          DIAG_SUMMARY_EXIT=$?
          set -e
          if [ "$DIAG_TEST_EXIT" -ne 0 ]; then exit "$DIAG_TEST_EXIT"; fi
          if [ "$DIAG_SUMMARY_EXIT" -ne 0 ]; then exit "$DIAG_SUMMARY_EXIT"; fi
          python3 - <<'PY'
          import json
          summary=json.load(open('export-diagnostic-evidence/test-summary.json'))
          assert summary['totalTestCount'] == 2 and summary['passedTests'] == 2, summary
          assert summary['failedTests'] == 0 and summary['skippedTests'] == 0, summary
          assert summary.get('expectedFailures',0) == 0, summary
          print('DIAGNOSTIC: both export cases passed; full release gates remain separate.')
          PY
      - name: Collect actual synthetic exports from this simulator only
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect-ci-exports.py --selected-device export-diagnostic-evidence/selected-device.json --evidence-dir export-diagnostic-evidence 2>&1 | tee export-diagnostic-evidence/export-collection.log
      - name: Require both complete real export fixtures
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        timeout-minutes: 2
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-export-pair.py --evidence-dir export-diagnostic-evidence --collector-report actual-exports.json --course YiwaiPractice/Resources/fortress-course-v1.json --output export-diagnostic-evidence/actual-exports-verification.json 2>&1 | tee export-diagnostic-evidence/export-verification.log
      - name: Preserve diagnostic logs, results and actual exports even on failure
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yiwai-export-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: source/export-diagnostic-evidence/
          if-no-files-found: error
          retention-days: 30
