name: Fortress candidate (unsigned native checks)
on:
  push:
    branches: [p0/fortress-core-review-20261126, codex/yiwai-fortress-release-20261126]
    paths:
      - 'YiwaiPractice/**'
      - '.github/workflows/fortress-candidate.yml'
      - 'scripts/**'
      - 'release-manifest.json'
      - 'PRIVACY.md'
      - 'NOTICE.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yiwai-fortress-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native ${{ matrix.suite }}
    if: github.ref == 'refs/heads/p0/fortress-core-review-20261126' || github.ref == 'refs/heads/codex/yiwai-fortress-release-20261126'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            target: YiwaiTests
            tests: 94
            test_minutes: 35
            job_minutes: 45
          - suite: ui
            target: YiwaiUITests
            tests: 34
            test_minutes: 90
            job_minutes: 100
    timeout-minutes: ${{ matrix.job_minutes }}
    env:
      TEST_TARGET: ${{ matrix.target }}
      EXPECTED_TEST_COUNT: ${{ matrix.tests }}
    steps:
      - name: Checkout exact public candidate without credentials
        id: checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout --detach "$GITHUB_SHA"
          mkdir -p ci-evidence
          git rev-parse HEAD | tee ci-evidence/source-commit.txt
          xcodebuild -version | tee ci-evidence/xcode-version.txt
      - name: Verify source manifest and JavaScript regressions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-source.py 2>&1 | tee ci-evidence/source-verification.log
          node --test YiwaiPractice/scripts/*-tests.cjs 2>&1 | tee ci-evidence/javascript-tests.log
          node YiwaiPractice/scripts/verify-fortress-course.cjs ci-evidence/fortress-course-validation.json
      - name: Select and record this job's simulator
        id: simulator
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > ci-evidence/devices.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('ci-evidence')
          devices=json.loads((root/'devices.json').read_text())['devices']
          options=[(runtime,x['name'],x['udid'],x) for runtime,items in devices.items() if 'iOS-' in runtime for x in items if x.get('isAvailable') and x['name'].startswith('iPhone')]
          assert options, 'No available iPhone simulator'
          selected=sorted(options,key=lambda x:x[:3])[-1]
          info=dict(selected[3],runtime=selected[0])
          assert info.get('dataPath'), 'simctl did not report the selected simulator dataPath'
          (root/'selected-device.json').write_text(json.dumps(info,indent=2))
          (root/'test-device.txt').write_text(info['udid']+'\n')
          print('Selected '+info['name']+' '+info['udid'])
          PY
      - name: Run complete target serially
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: ${{ matrix.test_minutes }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(cat ci-evidence/test-device.txt)
          printf '%s\n' "$TEST_TARGET" > ci-evidence/test-target.txt
          set +e
          xcodebuild test -project YiwaiPractice/YiwaiPractice.xcodeproj -scheme YiwaiPractice -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO "-only-testing:$TEST_TARGET" -resultBundlePath ci-evidence/DebugTests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-evidence/debug-tests.log
          TEST_EXIT=${PIPESTATUS[0]}
          printf '%s\n' "$TEST_EXIT" > ci-evidence/debug-tests-exit.txt
          xcrun xcresulttool get test-results summary --path ci-evidence/DebugTests.xcresult --compact > ci-evidence/test-summary.json 2> ci-evidence/test-summary-error.log
          SUMMARY_EXIT=$?
          set -e
          if [ "$TEST_EXIT" -ne 0 ]; then exit "$TEST_EXIT"; fi
          if [ "$SUMMARY_EXIT" -ne 0 ]; then exit "$SUMMARY_EXIT"; fi
          python3 - <<'PY'
          import json, os
          summary=json.load(open('ci-evidence/test-summary.json'))
          expected=int(os.environ['EXPECTED_TEST_COUNT'])
          # Update this inventory only when the full target intentionally gains/loses tests.
          assert summary['totalTestCount'] == expected, summary
          assert summary['passedTests'] == expected, summary
          assert summary['failedTests'] == 0 and summary['skippedTests'] == 0, summary
          assert summary.get('expectedFailures', 0) == 0, summary
          print(f"Complete {os.environ['TEST_TARGET']}: {expected} passed, no failures/skips")
          PY
      - name: Collect actual synthetic exports from this simulator only
        if: ${{ always() && steps.simulator.outcome == 'success' && matrix.suite == 'ui' }}
        timeout-minutes: 2
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/collect-ci-exports.py --selected-device ci-evidence/selected-device.json --evidence-dir ci-evidence 2>&1 | tee ci-evidence/export-collection.log
      - name: Require both complete real export fixtures
        if: ${{ always() && steps.simulator.outcome == 'success' && matrix.suite == 'ui' }}
        timeout-minutes: 2
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-export-pair.py --evidence-dir ci-evidence --collector-report actual-exports.json --course YiwaiPractice/Resources/fortress-course-v1.json --output ci-evidence/actual-exports-verification.json 2>&1 | tee ci-evidence/export-verification.log
      - name: Preserve this target's results and raw logs even on failure
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yiwai-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          path: source/ci-evidence/
          if-no-files-found: error
          retention-days: 30
  release:
    name: Unsigned iOS Release
    if: github.ref == 'refs/heads/p0/fortress-core-review-20261126' || github.ref == 'refs/heads/codex/yiwai-fortress-release-20261126'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout exact public candidate without credentials
        id: checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" source
          cd source
          git checkout --detach "$GITHUB_SHA"
          mkdir -p ci-evidence
          git rev-parse HEAD | tee ci-evidence/source-commit.txt
          xcodebuild -version | tee ci-evidence/xcode-version.txt
      - name: Verify exact source manifest
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-source.py 2>&1 | tee ci-evidence/source-verification.log
      - name: Release iOS device build (not signed or uploaded)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xcodebuild build -project YiwaiPractice/YiwaiPractice.xcodeproj -scheme YiwaiPractice -configuration Release -destination 'generic/platform=iOS' -resultBundlePath ci-evidence/ReleaseBuild.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-evidence/release-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$BUILD_EXIT" > ci-evidence/release-build-exit.txt
          exit "$BUILD_EXIT"
      - name: Preserve Release results and raw logs even on failure
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yiwai-release-${{ github.sha }}-${{ github.run_attempt }}
          path: source/ci-evidence/
          if-no-files-found: error
          retention-days: 30
